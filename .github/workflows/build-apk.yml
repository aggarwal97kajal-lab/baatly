name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --org app.baatly --project-name baatly --platforms=android .
          # Brand: app name, launcher icon, launch screen
          sed -i 's/android:label="[^"]*"/android:label="BAATLY"/' android/app/src/main/AndroidManifest.xml
          cp -r android_overrides/res/. android/app/src/main/res/

      - name: Get packages
        run: flutter pub get

      - name: Analyze (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk baatly.apk
          ls -lh baatly.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BAATLY build ${{ github.run_number }}
          body: |
            Demo build (Milestone 1) from commit ${{ github.sha }}.
            Download **baatly.apk** below and install on Android.
          files: baatly.apk
          make_latest: true
