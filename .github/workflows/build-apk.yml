name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --org app.baatly --project-name baatly --platforms=android .
          # Brand: app name, launcher icon, launch screen
          sed -i 's/android:label="[^"]*"/android:label="BAATLY"/' android/app/src/main/AndroidManifest.xml
          # Release builds need INTERNET explicitly (Flutter only adds it to debug/profile).
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || \
            sed -i '0,/<application/s|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml
          cp -r android_overrides/res/. android/app/src/main/res/
          # Passkeys (Credential Manager) need Android 9+.
          GRADLE=android/app/build.gradle.kts
          grep -q "minSdk = flutter.minSdkVersion" $GRADLE
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 28/' $GRADLE
          grep -n "minSdk" $GRADLE
          # Fingerprint prompt (local_auth) needs a FragmentActivity.
          MA=$(find android/app/src/main -name 'MainActivity.kt' | head -1)
          sed -i 's/io.flutter.embedding.android.FlutterActivity/io.flutter.embedding.android.FlutterFragmentActivity/; s/: FlutterActivity()/: FlutterFragmentActivity()/' $MA
          cat $MA
          grep -q "FlutterFragmentActivity()" $MA

      - name: Get packages
        run: flutter pub get

      - name: Analyze (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Sign with BAATLY release key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          IN=build/app/outputs/flutter-apk/app-release.apk
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::ANDROID_KEYSTORE_PASSWORD secret missing - APK stays debug-signed (updates and passkeys won't work)"
            cp $IN baatly.apk
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android_overrides/baatly-release.jks.enc -out /tmp/release.jks -pass env:KEYSTORE_PASSWORD
            BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
            $BT/apksigner sign --ks /tmp/release.jks --ks-key-alias baatly --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out baatly.apk $IN
            $BT/apksigner verify --print-certs baatly.apk | grep -i "SHA-256"
            rm -f /tmp/release.jks
          fi
          ls -lh baatly.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BAATLY build ${{ github.run_number }}
          body: |
            Demo build (Milestone 1) from commit ${{ github.sha }}.
            Download **baatly.apk** below and install on Android.
          files: baatly.apk
          make_latest: true
