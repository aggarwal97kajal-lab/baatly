name: Server diagnostics

on:
  push:
    branches: [main]
    paths: [".github/diag/**", ".github/workflows/diag.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Resolve D1 id
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const db=j.find(x=>x.name==="baatly-db");console.log(db?db.uuid:"")})')
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
      - name: Passkeys on record (no secrets / no keys printed)
        run: |
          npx wrangler d1 execute baatly-db --remote --json --command \
            "SELECT substr(p.id,1,12) AS cred, p.aaguid, p.device_type, p.backed_up, p.transports, datetime(p.created_at/1000,'unixepoch') AS created, datetime(p.last_used_at/1000,'unixepoch') AS used, substr(u.phone,1,5)||'*****'||substr(u.phone,-2) AS phone FROM passkeys p JOIN users u ON u.id=p.user_id ORDER BY p.created_at DESC LIMIT 10"
      - name: Recent passkey challenges
        run: |
          npx wrangler d1 execute baatly-db --remote --json --command \
            "SELECT kind, datetime(expires_at/1000,'unixepoch') AS expires FROM challenges ORDER BY expires_at DESC LIMIT 10"
