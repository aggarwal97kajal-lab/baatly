name: Deploy server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-server.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets missing - skipping deploy"
            echo "ok=false" >> $GITHUB_OUTPUT
          else
            echo "ok=true" >> $GITHUB_OUTPUT
          fi
      - if: steps.cf.outputs.ok == 'true'
        run: npm ci
      - if: steps.cf.outputs.ok == 'true'
        run: npx tsc --noEmit
      - name: Ensure D1 database
        if: steps.cf.outputs.ok == 'true'
        run: |
          find_id() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const db=j.find(x=>x.name==="baatly-db");console.log(db?db.uuid:"")})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler d1 create baatly-db; ID=$(find_id); fi
          echo "D1 id: $ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
      - name: Apply migrations
        if: steps.cf.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply baatly-db --remote
      - name: Ensure R2 bucket (chat media)
        if: steps.cf.outputs.ok == 'true'
        run: |
          if npx wrangler r2 bucket list 2>/tmp/r2err | grep -q "baatly-media"; then
            echo "R2 bucket exists"
          elif npx wrangler r2 bucket create baatly-media 2>>/tmp/r2err; then
            echo "R2 bucket created"
          else
            cat /tmp/r2err
            echo "::warning::R2 not available (enable R2 in the Cloudflare dashboard and give the API token 'Workers R2 Storage: Edit'). Deploying without chat media."
            sed -i '/# R2-BEGIN/,/# R2-END/d' wrangler.toml
          fi
      - name: Deploy worker
        if: steps.cf.outputs.ok == 'true'
        run: npx wrangler deploy
      - name: Set OTP provider secrets
        if: steps.cf.outputs.ok == 'true'
        env:
          MC_CUSTOMER_ID: ${{ secrets.MC_CUSTOMER_ID }}
          MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
        run: |
          if [ -n "$MC_CUSTOMER_ID" ] && [ -n "$MC_PASSWORD" ]; then
            node -e 'console.log(JSON.stringify({MC_CUSTOMER_ID:process.env.MC_CUSTOMER_ID,MC_PASSWORD:process.env.MC_PASSWORD}))' > /tmp/s.json
            npx wrangler secret bulk /tmp/s.json
            rm /tmp/s.json
            echo "Message Central configured - demo OTP disabled automatically"
          else
            echo "::notice::MC_CUSTOMER_ID / MC_PASSWORD not set - server runs in TEST mode (OTP 123456)"
          fi
      - name: Set push notification secret
        if: steps.cf.outputs.ok == 'true'
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            node -e 'const v=process.env.FCM_SERVICE_ACCOUNT;const j=JSON.parse(v);if(!j.private_key||!j.client_email||!j.project_id)throw new Error("FCM_SERVICE_ACCOUNT is not a Firebase service-account JSON");console.log(JSON.stringify({FCM_SERVICE_ACCOUNT:v}))' > /tmp/f.json
            npx wrangler secret bulk /tmp/f.json
            rm /tmp/f.json
            echo "Push notifications configured"
          else
            echo "::notice::FCM_SERVICE_ACCOUNT not set - push notifications off"
          fi
      - name: Set call relay (TURN) secrets
        if: steps.cf.outputs.ok == 'true'
        env:
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_TOKEN: ${{ secrets.TURN_KEY_TOKEN }}
        run: |
          if [ -n "$TURN_KEY_ID" ] && [ -n "$TURN_KEY_TOKEN" ]; then
            node -e 'console.log(JSON.stringify({TURN_KEY_ID:process.env.TURN_KEY_ID,TURN_KEY_TOKEN:process.env.TURN_KEY_TOKEN}))' > /tmp/t.json
            npx wrangler secret bulk /tmp/t.json
            rm /tmp/t.json
            echo "TURN configured"
          else
            echo "::notice::TURN_KEY_ID / TURN_KEY_TOKEN not set - calls use STUN only (may fail on some mobile networks)"
          fi
