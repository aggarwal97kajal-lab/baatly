name: Push check

on:
  push:
    branches: [main]
    paths: ["server/diag/**", ".github/workflows/push-check.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Point wrangler at the real database
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const db=j.find(x=>x.name==="baatly-db");console.log(db?db.uuid:"")})')
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
      - name: Check push
        run: node diag/push_check.mjs
