name: baatly
description: "BAATLY — Every Conversation Matters."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  http: ^1.2.0
  flutter_secure_storage: ^9.2.0
  passkeys: ^2.24.0
  image_picker: ^1.1.0
  image_cropper: ^13.0.0
  google_mlkit_subject_segmentation: ^0.3.2
  connectivity_plus: ^6.1.0
  gal: ^2.3.0
  device_info_plus: ^11.0.0
  file_picker: ">=8.1.0 <11.0.0"
  record: ">=5.1.0 <8.0.0"
  just_audio: ">=0.9.40 <0.11.0"
  open_filex: ^4.5.0
  emoji_picker_flutter: ^4.3.0
  geolocator: ">=13.0.0 <15.0.0"
  video_player: ^2.9.0
  video_compress: ^3.1.4
  flutter_map: ^8.1.0
  latlong2: ">=0.9.1 <0.11.0"
  flutter_webrtc: ">=0.12.0 <2.0.0"
  flutter_local_notifications: ">=18.0.0 <20.0.0"
  local_auth: ^2.3.0
  cryptography: ^2.7.0
  path_provider: ^2.1.5
  flutter_contacts: ^2.6.0
  url_launcher: ^6.3.0
  share_plus: ">=11.0.0 <13.1.0"
  web_socket_channel: ^3.0.3
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/wallpapers/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
